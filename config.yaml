# Address and port for DNS queries (UDP + TCP).
# ":53" binds all interfaces, IPv4 and IPv6 (dual-stack).
# Use "0.0.0.0:53" for IPv4 only, or a specific address to bind one interface.
listen: ":53"

upstreams:
  - "1.1.1.1:53"
  - "8.8.8.8:53"

# Blocklist URLs: hosts-file format or plain domain-per-line.
blocklists:
  - "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
  - "https://adaway.org/hosts.txt"
  # Optional lists from HaGeZi (GPL-3.0, https://github.com/hagezi/dns-blocklists).
  # Use the plain-domain "-onlydomains" files. s-hole's suffix blocking covers
  # subdomains, and the in-memory set removes duplicates, so you can stack these
  # with the lists above. To enable one, delete the leading "# ".
  #
  # Multi PRO is HaGeZi's recommended ads/tracker/malware list. Pick the full
  # list, or the mini list on a small box such as a Raspberry Pi:
  #   - "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro-onlydomains.txt"       # ~224k domains
  #   - "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/pro.mini-onlydomains.txt"  # ~50k domains
  #
  # Add-on lists you can stack on top:
  #   - "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/tif.mini-onlydomains.txt"  # threat intel: malware, phishing, C2 (mini, ~176k)
  #   - "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/popupads-onlydomains.txt"  # pop-up ads
  #   - "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/fake-onlydomains.txt"      # scams, subscription traps, fake sites

# Domains to never block regardless of blocklist hits.
whitelist:
  # - "example.com"

# How often to re-download blocklists (Go duration: 1h, 24h, 168h …)
refresh_interval: "24h"

# How often to print stats to stdout
stats_interval: "5m"

# How to respond to blocked queries: "zero" (0.0.0.0) or "nxdomain"
block_mode: "zero"

# TTL in seconds advertised on blocked replies.
# 0 tells clients not to cache them (whitelist changes then take effect
# immediately, at the cost of more repeat queries).
block_ttl: 300

# Which queries to write to the log: "all", "blocked", or "none".
# This controls the log-backed dashboard panels (Queries over time, Recent
# Queries, and Top Blocked "All time"). "blocked" limits them to blocked
# queries, so the graph shows one blocked line. "none" leaves them empty. The
# stat cards are not affected. They count every query from the in-memory counter.
log_queries: "all"

# How the client IP is stored in the query log and shown in Top Clients:
# "raw" (as-is), "drop" (store no client), or "subnet" (mask the host bits to
# IPv4 /24 or IPv6 /64). The client is masked once at write time, so the log
# file, the SQLite log, and the Top Clients panel all see the same value.
# Masking is forward-only: rows written at "raw" keep their addresses.
# On a flat single-subnet home LAN, "subnet" collapses every client to one
# address, so use "drop" there. "subnet" is for segmented or VLAN networks.
query_privacy: "raw"

# client_names gives each client a label in the log and the Top Clients panel.
# A key is an exact IP or a CIDR. The value is the label.
# The label is read-only. s-hole resolves it from the stored client value, which
# query_privacy has already masked. So a label never shows more than query_privacy.
#   query_privacy: raw    -> an exact-IP or CIDR key matches (host labels work)
#   query_privacy: subnet -> only a CIDR or network-address key matches, because
#                            the host bits are masked. Use CIDR keys here.
#   query_privacy: drop   -> no client is stored, so no key matches.
# An exact key wins over a CIDR. The most specific CIDR wins.
# s-hole skips a bad key and logs a WARN. This map has no S_HOLE_* override.
client_names:
  # "192.168.1.42": kids-ipad
  # "10.0.5.0/24": iot-vlan

# Plain-text query log file (leave empty to write to stdout)
log_file: ""

# SQLite database for persistent query log + historical top-domain queries
# Leave empty to disable SQLite logging.
query_db: "queries.db"

# Directory to cache downloaded blocklists (avoids re-downloading on restart)
cache_dir: "."

# Address:port for the admin web UI and REST API.
# Default is "127.0.0.1:8080". Localhost only, no LAN access.
# Set to "0.0.0.0:8080" to expose the UI to every device on the LAN.
api_listen: "127.0.0.1:8080"

# Maximum number of DNS responses to hold in the in-memory cache.
# Cached responses are served without an upstream round-trip until their TTL expires.
# Set to 0 to disable. Recommended: 2000–5000 for a Raspberry Pi.
cache_size: 2000

# How often the query log is flushed to SQLite.
# Longer intervals reduce SD card / flash write cycles on embedded hardware.
# 30s is a good balance between data freshness and write wear.
db_flush_interval: "30s"

# Delete query-log rows older than this many days. 0 = retain forever.
# A background prune runs hourly when this is > 0.
query_db_retention_days: 0

# Expose net/http/pprof handlers under /debug/pprof/ on the admin HTTP
# server. Off by default. Enable it only to investigate a running
# incident, and only when api_listen is bound to localhost. pprof
# reveals goroutine stacks, heap layouts, and symbols that are useful to
# the operator and dangerous in the wrong hands.
enable_pprof: false

# Answer PTR (reverse DNS) queries for RFC 6303 private-range zones
# (10/8, 172.16/12, 192.168/16, fc00::/7, fe80::/10) locally with
# authoritative NXDOMAIN instead of forwarding them upstream.
# No public resolver can ever hold records for these addresses. Forwarding
# wastes a round-trip on every request and leaks LAN addressing to the
# upstream resolver. Recommended: true (the default).
# If you run a private reverse DNS zone on your LAN, set this to false.
# Queries for it then reach a forwarding resolver that can answer them.
local_ptr: true
