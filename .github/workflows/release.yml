name: Release

on:
  push:
    tags: ["v*"]

# No token rights by default; each job declares the rights it needs.
# id-token and attestations (build, docker): sign the provenance attestations
# with a short-lived Sigstore certificate and store them on GitHub.
permissions: {}

jobs:
  build:
    name: build / ${{ matrix.target.slug }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target:
          - { goos: linux,   goarch: amd64, slug: linux_amd64, archive: targz }
          - { goos: linux,   goarch: arm64, slug: linux_arm64, archive: targz }
          - { goos: linux,   goarch: arm, goarm: "7", slug: linux_armv7, archive: targz }
          - { goos: windows, goarch: amd64, slug: windows_amd64, archive: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          # A release builds from a clean module and build cache. A cache that
          # another workflow saved cannot change the published binaries.
          cache: false
      - name: Resolve version metadata
        id: meta
        # On a tag push the tag name is the authoritative version, so use it
        # directly instead of `git describe` (which the Makefile and CI use).
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and package ${{ matrix.target.slug }}
        id: package
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
          SLUG: ${{ matrix.target.slug }}
          ARCHIVE: ${{ matrix.target.archive }}
        run: |
          set -euo pipefail
          VPKG=github.com/lcsabi/s-hole/internal/version
          bin=s-hole
          if [ "$GOOS" = "windows" ]; then bin=s-hole.exe; fi

          stage="dist/s-hole_${VERSION}_${SLUG}"
          mkdir -p "$stage"
          go build -trimpath -ldflags="-s -w \
            -X '${VPKG}.Version=${VERSION}' \
            -X '${VPKG}.Commit=${COMMIT}' \
            -X '${VPKG}.BuildDate=${BUILD_DATE}'" \
            -o "$stage/$bin" ./cmd/s-hole

          # Ship the sample config and the docs/license in every archive.
          cp config.yaml LICENSE README.md PRIVACY.md "$stage/"
          # The deploy helpers are Linux-only.
          if [ "$GOOS" = "linux" ]; then
            cp deploy/install-linux.sh deploy/uninstall-linux.sh deploy/s-hole.service "$stage/"
          fi

          mkdir -p out
          base="s-hole_${VERSION}_${SLUG}"
          if [ "$ARCHIVE" = "zip" ]; then
            archive="out/${base}.zip"
            ( cd dist && zip -r -q "../${archive}" "s-hole_${VERSION}_${SLUG}" )
          else
            archive="out/${base}.tar.gz"
            tar -C dist -czf "$archive" "s-hole_${VERSION}_${SLUG}"
          fi

          # The release job names this Go version in the release notes. The
          # file is not a release asset (only s-hole_* files are attached).
          go env GOVERSION > "out/goversion_${SLUG}.txt"

          echo "binary=${stage}/${bin}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        # Signs the archive and the binary in it, so a user can check with
        # `gh attestation verify` that this workflow built them from this tag.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.binary }}
      - name: Upload archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target.slug }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # contents: write to create the GitHub Release and upload the archives.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true
      - name: Checksums and release notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ( cd artifacts && sha256sum s-hole_* > SHA256SUMS )
          # Extract the CHANGELOG section for this version. Strip the leading
          # "v", then drop any pre-release suffix (v0.1.0-rc1 -> 0.1.0), so a
          # release candidate resolves the same [0.1.0] section its final tag
          # will. A final tag has no "-" and is unchanged.
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          awk -v v="$version" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' docs/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > notes.md
          fi

          # Name the Go release that built the archives and the image. Every
          # build job must report the same one. The image builder is the
          # golang image that the Dockerfile pins by digest.
          go_archives="$(sort -u artifacts/goversion_*.txt)"
          if [ "$(printf '%s\n' "$go_archives" | wc -l)" -ne 1 ] || [ -z "$go_archives" ]; then
            echo "the build jobs used different Go versions: ${go_archives}" >&2
            exit 1
          fi
          go_image="$(sed -n 's/^FROM .*golang:\([0-9][0-9.]*\)-.*/go\1/p' Dockerfile)"
          if [ -z "$go_image" ]; then
            echo "no golang builder image found in the Dockerfile" >&2
            exit 1
          fi
          {
            echo
            echo "### Build"
            echo
            echo "- Archives: built with ${go_archives}."
            echo "- Container image: built with ${go_image}."
          } >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease \
            artifacts/s-hole_* artifacts/SHA256SUMS

  docker:
    name: push image to ghcr.io
    runs-on: ubuntu-latest
    needs: build
    # packages: write to push the image and its attestation to ghcr.io.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute image tags
        id: tags
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          repo="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          tags="ghcr.io/${repo}:${version}"
          # Move :latest only for final releases (tags without a pre-release
          # suffix such as -rc1).
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags="${tags},ghcr.io/${repo}:latest" ;;
          esac
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve build metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          # BuildKit stores an SBOM (the packages in each image) and its own
          # build provenance next to the image in the registry.
          sbom: true
          provenance: mode=max
      - name: Attest build provenance
        # The same kind of provenance as the archives, so `gh attestation
        # verify` also checks the image (with an oci:// reference).
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record needs the artifact-metadata right and is for
          # organization artifact tracking, which this repository does not use.
          create-storage-record: false
