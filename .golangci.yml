version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - revive
    # gosec: fix a finding, or put //nolint:gosec // G<NNN>: <why> on its
    # line. Do not exclude a rule for the whole tree. nolintlint checks
    # every //nolint (see its settings).
    - gosec
    - nolintlint

  settings:
    errcheck:
      # golangci-lint v2 dropped the v1 default exclusions; restore the
      # idiomatic subset we rely on. Everything here is a deliberate
      # best-effort call: fmt.Fprint* targets http.ResponseWriters (a
      # failed write means the client hung up) or the best-effort query
      # log; the Close variants are deferred cleanup on read paths where
      # no data can be lost. Writes that CAN lose data (DBLogger.Close,
      # FileLogger.Close, cache-file renames) check their errors in code.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        # The Windows service commands close their service manager handles
        # when they return; a failed close loses nothing.
        - (*golang.org/x/sys/windows/svc/mgr.Mgr).Disconnect
        - (*golang.org/x/sys/windows/svc/mgr.Service).Close
    revive:
      rules:
        # Allow short names in handler receivers and small loops.
        - name: var-naming
          disabled: false
    nolintlint:
      # A //nolint names its linter and says why, and is removed when the
      # finding goes away.
      require-specific: true
      require-explanation: true
      allow-unused: false

  exclusions:
    rules:
      # Tests routinely ignore errors from setup helpers (write file, close,
      # cleanup) and over-strict errcheck is more noise than signal there.
      # Tests also open temporary paths and write fixed inputs on purpose,
      # which gosec reports.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # Generated/embed files don't need lint coverage.
      - path: static/
        linters:
          - misspell

formatters:
  enable:
    - gofmt
